app:
  topic: orders
linking:
  # The EU linking service (API not final yet, see docs/REQUIREMENTS.md)
  base-url: ${LINKING_BASE_URL:http://localhost:8089}
  connect-timeout: 1s
  read-timeout: 2s
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,kafka,db
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sunkafka}
    username: ${DB_USERNAME:sunkafka}
    password: ${DB_PASSWORD:sunkafka}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    properties:
      schema.registry.url: ${SCHEMA_REGISTRY_URL:http://localhost:8081}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: io.confluent.kafka.serializers.KafkaAvroSerializer
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      group-id: sun-kafka-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: io.confluent.kafka.serializers.KafkaAvroDeserializer
        specific.avro.reader: true
