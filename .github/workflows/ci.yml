name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Docker is available on ubuntu-latest, so the Testcontainers test runs against a real broker.
      - run: mvn -B verify
      # The Docker-based tests self-skip when Docker is unusable; do not let that pass silently in CI.
      - name: Fail if a Docker-based test was skipped
        run: |
          for t in KafkaContainerTest PostgresMigrationTest; do
            if grep -q '<skipped' "target/surefire-reports/TEST-com.sunkafka.$t.xml"; then
              echo "::error::$t was skipped (Docker not usable by Testcontainers)"
              exit 1
            fi
          done
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            target/cucumber-reports/
            target/site/jacoco/
          if-no-files-found: ignore
