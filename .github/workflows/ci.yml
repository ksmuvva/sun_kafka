name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      # Docker is available on ubuntu-latest, so the Testcontainers test runs against a real broker.
      - run: mvn -B verify
      # The real-broker test self-skips when Docker is unusable; do not let that pass silently in CI.
      - name: Fail if the real-broker test was skipped
        run: |
          if grep -q '<skipped' target/surefire-reports/TEST-com.sunkafka.KafkaContainerTest.xml; then
            echo "::error::KafkaContainerTest was skipped (Docker not usable by Testcontainers)"
            exit 1
          fi
      - name: Upload Cucumber report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-report
          path: target/cucumber-reports/
          if-no-files-found: ignore
